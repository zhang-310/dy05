# SonarQube 配置文件

# 项目信息
sonar.projectKey=dy05
sonar.projectName=dy05 - 抖音运营 SaaS 平台
sonar.projectVersion=1.0.0

# 源代码路径
sonar.sources=douyin-operations-common/src/main,douyin-operations-platform/src/main,douyin-operations-integration/src/main,douyin-operations-asset/src/main,douyin-operations-content/src/main,douyin-operations-intelligence/src/main,douyin-operations-douyin/src/main,douyin-operations-payment/src/main,douyin-operations-live/src/main,douyin-operations-shortvideo/src/main,douyin-operations-app/src/main,front/src

# 测试代码路径
sonar.tests=douyin-operations-common/src/test,douyin-operations-platform/src/test,douyin-operations-integration/src/test,douyin-operations-asset/src/test,douyin-operations-content/src/test,douyin-operations-intelligence/src/test,douyin-operations-douyin/src/test,douyin-operations-payment/src/test,douyin-operations-live/src/test,douyin-operations-shortvideo/src/test,douyin-operations-app/src/test,front/src/**/*.test.ts,front/src/**/*.test.tsx

# Java 配置
sonar.java.source=17
sonar.java.binaries=**/target/classes
sonar.java.libraries=**/target/dependency/*.jar

# JavaScript/TypeScript 配置
sonar.javascript.lcov.reportPaths=front/coverage/lcov.info
sonar.typescript.lcov.reportPaths=front/coverage/lcov.info

# 覆盖率报告
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# 排除文件
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/tests/**

# 代码重复检测
sonar.cpd.exclusions=**/entity/**,**/vo/**,**/dto/**

# 质量门禁
sonar.qualitygate.wait=true

# 编码
sonar.sourceEncoding=UTF-8

# 语言
sonar.language=java,js,ts

# 分析参数
sonar.scm.provider=git
sonar.scm.disabled=false
