name: Six Products Nightly

on:
  schedule:
    - cron: '0 20 * * 1'  # 每周一 04:00 UTC+8
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Gaifan verify base URL (default http://localhost:18082 for self-hosted staging)'
        required: false
        default: 'http://localhost:18082'
      full_sellable:
        description: 'Run full sellable + integration E2E (requires running Gaifan instance)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  unit-and-optional-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run six-products CI (unit tests)
        run: pwsh scripts/run-six-products-ci.ps1 -SkipHttpVerify

      - name: Full sellable HTTP verify (staging)
        if: github.event.inputs.full_sellable == 'true' && github.event.inputs.base_url != ''
        env:
          GAIFAN_JWT_E2E: 'true'
          KB_STORE: pgvector
        run: |
          pwsh scripts/run-six-products-ci.ps1 -FullSellable -BaseUrl "${{ github.event.inputs.base_url }}"

      - name: Optional HTTP verify (M4 + KB only)
        if: github.event.inputs.full_sellable != 'true' && github.event.inputs.base_url != ''
        run: |
          pwsh scripts/verify-seven-products-sellable.ps1 -BaseUrl "${{ github.event.inputs.base_url }}" -SkipJwt
