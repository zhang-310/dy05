name: Weekly Dependency Check

on:
  schedule:
    - cron: '0 20 * * 0'  # 每周日 04:00 UTC+8 (20:00 UTC)
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Dependency Check
        run: |
          chmod +x scripts/auto-check-dependencies.sh
          ./scripts/auto-check-dependencies.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports-${{ github.run_number }}
          path: reports/dependencies/
          retention-days: 90

      - name: Create Security Advisory for Critical Vulnerabilities
        if: always()
        run: |
          # 检查是否有严重漏洞
          if [ -f "reports/dependencies/backend-security-$(date +%Y-%m-%d).json" ]; then
            CRITICAL_COUNT=$(jq '[.dependencies[] | select(.vulnerabilities[]?.severity == "CRITICAL")] | length' reports/dependencies/backend-security-$(date +%Y-%m-%d).json)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "发现 $CRITICAL_COUNT 个严重漏洞"
              # 这里可以调用 GitHub Security Advisory API
            fi
          fi

      - name: Notify on High Severity Vulnerabilities
        if: always()
        run: |
          chmod +x scripts/notify-wecom.sh
          if grep -q "CRITICAL\|HIGH" reports/dependencies/*-security-*.json 2>/dev/null; then
            ./scripts/notify-wecom.sh "⚠️ 发现高危依赖漏洞，请查看报告"
          fi
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
