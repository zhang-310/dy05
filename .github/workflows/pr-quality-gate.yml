name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Tests with Coverage
        run: |
          chmod +x scripts/auto-test-coverage.sh
          ./scripts/auto-test-coverage.sh

      - name: Check Coverage Threshold
        run: |
          BACKEND_COVERAGE=$(jq -r '.backend.lineCoverage // 0' reports/coverage/$(date +%Y-%m-%d).json)
          FRONTEND_COVERAGE=$(jq -r '.frontend.lineCoverage // 0' reports/coverage/$(date +%Y-%m-%d).json)

          echo "后端覆盖率: $BACKEND_COVERAGE%"
          echo "前端覆盖率: $FRONTEND_COVERAGE%"

          if (( $(echo "$BACKEND_COVERAGE < 80" | bc -l) )); then
            echo "❌ 后端覆盖率不足 80%: $BACKEND_COVERAGE%"
            exit 1
          fi

          if (( $(echo "$FRONTEND_COVERAGE < 80" | bc -l) )); then
            echo "❌ 前端覆盖率不足 80%: $FRONTEND_COVERAGE%"
            exit 1
          fi

      - name: Comment PR with Coverage Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const reportPath = `reports/coverage/${date}.json`;

            if (!fs.existsSync(reportPath)) {
              console.log('Coverage report not found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const body = `## 📊 测试覆盖率报告

            | 模块 | 覆盖率 | 状态 |
            |------|--------|------|
            | 后端 | ${report.backend?.lineCoverage || 0}% | ${report.backend?.lineCoverage >= 80 ? '✅' : '❌'} |
            | 前端 | ${report.frontend?.lineCoverage || 0}% | ${report.frontend?.lineCoverage >= 80 ? '✅' : '❌'} |

            **阈值要求**: 80%

            📄 [查看详细报告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_number }}
          path: reports/coverage/
          retention-days: 30
