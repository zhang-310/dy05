name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend
        run: mvn package -DskipTests -B

      - name: Build Docker image
        run: |
          docker build -t dy05-backend:${{ github.sha }} \
            -f docker/Dockerfile.backend .

      - name: Push to registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag dy05-backend:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/dy05-backend:${{ github.sha }}
          docker tag dy05-backend:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/dy05-backend:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/dy05-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/dy05-backend:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: douyin-operations-app/target/*.jar

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build frontend
        working-directory: front
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Build Docker image
        run: |
          docker build -t dy05-frontend:${{ github.sha }} \
            -f docker/Dockerfile.frontend ./front

      - name: Push to registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag dy05-frontend:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/dy05-frontend:${{ github.sha }}
          docker tag dy05-frontend:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/dy05-frontend:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/dy05-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/dy05-frontend:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: ${{ github.event.inputs.environment == 'staging' || github.ref == 'refs/heads/main' }}
    environment:
      name: staging
      url: https://staging.dy05.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          # SSH to staging server and deploy
          echo "Deploying to staging environment"
          # kubectl apply -f k8s/staging/ or docker-compose up -d

      - name: Run smoke tests
        run: |
          # Wait for deployment
          sleep 30

          # Health check
          curl -f https://staging.dy05.example.com/actuator/health || exit 1

          # Basic API test
          curl -f https://staging.dy05.example.com/api/v1/auth/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: ${{ github.event.inputs.environment == 'production' || startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: production
      url: https://dy05.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          # SSH to production server and deploy
          echo "Deploying to production environment"
          # kubectl apply -f k8s/production/ or docker-compose up -d

      - name: Run smoke tests
        run: |
          # Wait for deployment
          sleep 30

          # Health check
          curl -f https://dy05.example.com/actuator/health || exit 1

          # Basic API test
          curl -f https://dy05.example.com/api/v1/auth/health || exit 1

      - name: Notify team
        if: success()
        run: |
          echo "Production deployment successful"
          # Send notification to Slack/WeChat/Email

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back"
          # kubectl rollout undo deployment/dy05-backend
          # kubectl rollout undo deployment/dy05-frontend
