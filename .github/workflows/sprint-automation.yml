name: Sprint Task Automation

on:
  workflow_dispatch:
    inputs:
      sprint:
        description: 'Sprint number (e.g., 1, 2, 3)'
        required: true
        type: string
      task_id:
        description: 'Task ID (e.g., B1.1, F1.1) or "all" for all tasks'
        required: true
        type: string
  schedule:
    # Run daily at 9:00 AM UTC (5:00 PM Beijing Time)
    - cron: '0 9 * * *'

jobs:
  check-sprint-status:
    name: Check Sprint Status
    runs-on: ubuntu-latest
    outputs:
      current_sprint: ${{ steps.status.outputs.sprint }}
      pending_tasks: ${{ steps.status.outputs.tasks }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Sprint status
        id: status
        run: |
          # Read current Sprint from docs/SPRINT-1-TASKS.md
          CURRENT_SPRINT=$(grep -oP 'Sprint \K\d+' docs/SPRINT-1-TASKS.md | head -1)
          echo "sprint=$CURRENT_SPRINT" >> $GITHUB_OUTPUT

          # Count pending tasks (⚠️ TODO status)
          PENDING=$(grep -c "⚠️ TODO" docs/SPRINT-1-TASKS.md || echo "0")
          echo "tasks=$PENDING" >> $GITHUB_OUTPUT

          echo "Current Sprint: $CURRENT_SPRINT"
          echo "Pending tasks: $PENDING"

  run-backend-tasks:
    name: Run Backend Tasks
    runs-on: ubuntu-latest
    needs: check-sprint-status
    if: ${{ needs.check-sprint-status.outputs.pending_tasks > 0 }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dy05_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Task B1.1 - LiveScriptVO field completion
        if: ${{ github.event.inputs.task_id == 'B1.1' || github.event.inputs.task_id == 'all' }}
        run: |
          echo "Executing Task B1.1: LiveScriptVO field completion"

          # Verify LiveScriptVO has all 30 fields
          FIELD_COUNT=$(grep -c "private" douyin-operations-live/src/main/java/cn/gaifan/douyinOperations/module/live/vo/LiveScriptVO.java || echo "0")

          if [ "$FIELD_COUNT" -lt 30 ]; then
            echo "❌ LiveScriptVO missing fields (found $FIELD_COUNT, expected 30)"
            exit 1
          fi

          echo "✅ LiveScriptVO has all 30 fields"

          # Compile to verify
          mvn compile -pl douyin-operations-live -am -B

          echo "✅ Task B1.1 completed"

      - name: Task B1.2 - LiveSessionSaveVO field completion
        if: ${{ github.event.inputs.task_id == 'B1.2' || github.event.inputs.task_id == 'all' }}
        run: |
          echo "Executing Task B1.2: LiveSessionSaveVO field completion"

          # Check for required fields
          grep -q "personaId" douyin-operations-live/src/main/java/cn/gaifan/douyinOperations/module/live/vo/LiveSessionSaveVO.java
          grep -q "scriptStyle" douyin-operations-live/src/main/java/cn/gaifan/douyinOperations/module/live/vo/LiveSessionSaveVO.java
          grep -q "sessionType" douyin-operations-live/src/main/java/cn/gaifan/douyinOperations/module/live/vo/LiveSessionSaveVO.java
          grep -q "liveFormat" douyin-operations-live/src/main/java/cn/gaifan/douyinOperations/module/live/vo/LiveSessionSaveVO.java

          echo "✅ All required fields present"

          # Compile to verify
          mvn compile -pl douyin-operations-live -am -B

          echo "✅ Task B1.2 completed"

      - name: Task B1.3 - Cache implementation
        if: ${{ github.event.inputs.task_id == 'B1.3' || github.event.inputs.task_id == 'all' }}
        run: |
          echo "Executing Task B1.3: Cache implementation"

          # Verify CacheConfig exists
          test -f douyin-operations-common/src/main/java/cn/gaifan/douyinOperations/common/config/CacheConfig.java

          # Check for Caffeine cache beans
          grep -q "liveScriptCache" douyin-operations-common/src/main/java/cn/gaifan/douyinOperations/common/config/CacheConfig.java
          grep -q "liveSessionCache" douyin-operations-common/src/main/java/cn/gaifan/douyinOperations/common/config/CacheConfig.java

          echo "✅ Cache configuration verified"

          # Run tests
          mvn test -pl douyin-operations-live -am -B

          echo "✅ Task B1.3 completed"

      - name: Run all backend tests
        run: mvn test -B

      - name: Update task status
        if: success()
        run: |
          # Update SPRINT-1-TASKS.md to mark tasks as complete
          # This would be done via a commit in a real scenario
          echo "Tasks completed successfully"

  run-frontend-tasks:
    name: Run Frontend Tasks
    runs-on: ubuntu-latest
    needs: check-sprint-status
    if: ${{ needs.check-sprint-status.outputs.pending_tasks > 0 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Task F1.1 - LiveScript type definition
        if: ${{ github.event.inputs.task_id == 'F1.1' || github.event.inputs.task_id == 'all' }}
        run: |
          echo "Executing Task F1.1: LiveScript type definition"

          # Check for required fields in types/live.ts
          grep -q "scriptType" front/src/types/live.ts
          grep -q "style" front/src/types/live.ts
          grep -q "effectivenessScore" front/src/types/live.ts

          echo "✅ Type definitions verified"

          # Type check
          cd front && npm run type-check

          echo "✅ Task F1.1 completed"

      - name: Task F1.2 - LiveSession type definition
        if: ${{ github.event.inputs.task_id == 'F1.2' || github.event.inputs.task_id == 'all' }}
        run: |
          echo "Executing Task F1.2: LiveSession type definition"

          # Check for required fields
          grep -q "personaId" front/src/types/live.ts
          grep -q "scriptStyle" front/src/types/live.ts

          echo "✅ Type definitions verified"

          # Type check
          cd front && npm run type-check

          echo "✅ Task F1.2 completed"

      - name: Run all frontend tests
        working-directory: front
        run: npm run test

      - name: Build frontend
        working-directory: front
        run: npm run build

  daily-report:
    name: Generate Daily Report
    runs-on: ubuntu-latest
    needs: [run-backend-tasks, run-frontend-tasks]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate report
        run: |
          echo "# Sprint Daily Report - $(date +%Y-%m-%d)" > report.md
          echo "" >> report.md
          echo "## Task Status" >> report.md
          echo "" >> report.md

          # Count task statuses
          TODO=$(grep -c "⚠️ TODO" docs/SPRINT-1-TASKS.md || echo "0")
          IN_PROGRESS=$(grep -c "🔄 IN PROGRESS" docs/SPRINT-1-TASKS.md || echo "0")
          DONE=$(grep -c "✅ DONE" docs/SPRINT-1-TASKS.md || echo "0")

          echo "- TODO: $TODO" >> report.md
          echo "- IN PROGRESS: $IN_PROGRESS" >> report.md
          echo "- DONE: $DONE" >> report.md
          echo "" >> report.md

          echo "## Test Results" >> report.md
          echo "- Backend: ${{ needs.run-backend-tasks.result }}" >> report.md
          echo "- Frontend: ${{ needs.run-frontend-tasks.result }}" >> report.md

          cat report.md

      - name: Send notification
        if: failure()
        run: |
          echo "Sprint automation failed. Please check the logs."
          # In production, send to Slack/Email/WeChat
