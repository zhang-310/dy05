# ============================================================
# 抖音运营平台 - Docker 编排
# 默认：复用已有 claude-douyin-milvus (host.docker.internal:19631)
# 自建 AI：docker compose --profile ai-builtin up -d
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: dy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgresql}
      POSTGRES_DB: ${POSTGRES_DB:-douyin_operations}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [dy-net]

  redis:
    image: redis:7-alpine
    container_name: dy-redis
    restart: unless-stopped
    # maxmemory 略小于容器上限：RDB/AOF 重写 fork 会短时多占内存，避免 OOM
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1536mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 非 Swarm 下 mem_limit 更稳妥；与 deploy 一并给出便于桌面 Docker 显示一致
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [dy-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [dy-net]

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: dy-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # WARNING: 生产环境必须设置为 true 并配置用户认证
      # 开发环境保持 false 以简化本地开发
      xpack.security.enabled: "${ES_SECURITY_ENABLED:-false}"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    networks: [dy-net]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: dy-etcd
    restart: unless-stopped
    profiles: [ai-builtin]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [dy-net]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: dy-minio
    restart: unless-stopped
    profiles: [ai-builtin]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [dy-net]

  milvus:
    image: milvusdb/milvus:v2.6.11
    container_name: dy-milvus
    restart: unless-stopped
    profiles: [ai-builtin]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks: [dy-net]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: douyin-operations/app:latest
    container_name: dy-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      # 本地 Compose 默认关闭进化 ROI 降频（否则 Redis ai:evolve:throttle 会导致长时间「跳过本轮」）。真实生产请显式 EVOLVE_ROI_THROTTLE_ENABLED=true
      EVOLVE_ROI_THROTTLE_ENABLED: ${EVOLVE_ROI_THROTTLE_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-douyin_operations}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      MILVUS_ENABLED: ${MILVUS_ENABLED:-false}
      MILVUS_HOST: ${MILVUS_HOST:-host.docker.internal}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      OLLAMA_URL: ${OLLAMA_URL:-}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8888}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    networks: [dy-net]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: douyin-operations/frontend:latest
    container_name: dy-frontend
    restart: unless-stopped
    networks: [dy-net]

  nginx:
    image: nginx:1.25-alpine
    container_name: dy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8888}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - app
    networks: [dy-net]

  # ==================== 监控（可选） ====================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dy-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=2GB"
    networks: [dy-net]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: dy-grafana
    restart: unless-stopped
    profiles: [monitoring]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [dy-net]

networks:
  dy-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data:
