# ============================================================
# Nginx 网关配置
# 反向代理、API 路由、速率限制
# ============================================================

# 上游服务定义
upstream backend_api {
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ==================== HTTP 到 HTTPS 重定向 ====================
server {
    listen 80;
    server_name _;

    # 健康检查路由（HTTP）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # 其他路由重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== HTTPS 主服务 ====================
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书配置（生产环境应替换为真实证书）
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ==================== 安全头 ====================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ==================== 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;
    gzip_comp_level 6;

    # ==================== 请求体大小限制 ====================
    client_max_body_size 100M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ==================== 速率限制 ====================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=200r/s;

    # ==================== 前端路由 ====================
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # 超时设置
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        limit_req zone=frontend_limit burst=50 nodelay;

        access_log /var/log/nginx/frontend.log combined;
    }

    # ==================== API 路由 ====================
    location /api/v1/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # 缓冲设置（API 响应可能较大）
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;

        # 超时设置（AI 请求可能较长）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # 速率限制
        limit_req zone=api_limit burst=20 nodelay;

        access_log /var/log/nginx/api.log combined buffer=32k flush=5s;
    }

    # ==================== Swagger UI 及 API 文档 ====================
    location /swagger-ui/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ==================== Actuator 端点（内部使用）====================
    location /actuator/ {
        allow 172.28.0.0/24;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ==================== 健康检查 ====================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # ==================== 静态资源缓存 ====================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
    }

    # ==================== 日志 ====================
    access_log /var/log/nginx/gateway-access.log combined;
    error_log /var/log/nginx/gateway-error.log warn;
}
