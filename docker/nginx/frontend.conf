# ============================================================
# Nginx 前端配置
# SPA 路由、gzip 压缩、缓存控制
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 根路径
    root /usr/share/nginx/html;
    index index.html;

    # ==================== 安全头 ====================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # ==================== 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;
    gzip_disable "msie6";
    gzip_comp_level 6;

    # ==================== 缓存策略 ====================

    # SPA 入口（index.html）：不缓存，始终检查更新
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS/CSS 资源：长期缓存（版本化）
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体资源：长期缓存
    location ~* \.(png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== SPA 路由 ====================
    # 所有路由不存在的请求转发到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 健康检查 ====================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # ==================== 错误页 ====================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==================== 日志 ====================
    access_log /var/log/nginx/frontend-access.log combined;
    error_log /var/log/nginx/frontend-error.log warn;
}
