groups:
  - name: douyin-operations-alerts
    rules:
      # 应用实例宕机
      - alert: AppInstanceDown
        expr: up{job="douyin-operations"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "应用实例宕机"
          description: "{{ $labels.instance }} 已宕机超过 1 分钟"

      # API 响应时间过高（P95 > 2s）
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="douyin-operations"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P95 响应时间过高"
          description: "P95 延迟 {{ $value }}s，超过 2s 阈值"

      # 5xx 错误率过高（> 5%）
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx 错误率过高"
          description: "5xx 错误率 {{ $value | humanizePercentage }}，超过 5% 阈值"

      # JVM 堆内存使用率过高（> 85%）
      - alert: HighJvmHeapUsage
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "堆内存使用率 {{ $value | humanizePercentage }}"

      # 数据库连接池耗尽（活跃连接 > 80%）
      - alert: DbConnectionPoolExhausted
        expr: |
          hikaricp_connections_active
          / hikaricp_connections_max > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池即将耗尽"
          description: "活跃连接占比 {{ $value | humanizePercentage }}"

      # Redis 连接失败
      - alert: RedisConnectionFailure
        expr: increase(lettuce_command_completion_total{status="FAILED"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接异常"
          description: "5 分钟内 Redis 失败命令数 {{ $value }}"

      # 磁盘空间不足（< 15%）
      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘空间不足"
          description: "剩余空间 {{ $value | humanizePercentage }}"

      # Circuit Breaker 打开
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "熔断器已打开"
          description: "{{ $labels.name }} 熔断器处于 OPEN 状态"

      - alert: PostgresConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "数据库连接池即将耗尽 ({{ $value | humanizePercentage }})"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用率过高 ({{ $value | humanizePercentage }})"

      - alert: RabbitMQMessageBacklog
        expr: rabbitmq_queue_messages_unacked > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ 未确认消息堆积 ({{ $value }})"

      - alert: SlowApiResponse
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API P99 延迟过高 ({{ $value }}s)"

      - alert: CacheHitRateLow
        expr: rate(cache_gets_hit_total[5m]) / rate(cache_gets_total[5m]) < 0.7
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "缓存命中率低于 70%"
