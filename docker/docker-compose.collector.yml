# Remote collector node. Run this on each Tencent Cloud collection server.
# It does not start Postgres/Redis/RabbitMQ and does not write to the database.
services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.collector
    image: douyin-operations/collector:latest
    container_name: dy-collector
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Shanghai}
      COLLECTOR_WORKER_ID: ${COLLECTOR_WORKER_ID:?set unique worker id, e.g. tencent-shanghai-01}
      COLLECTOR_REGION: ${COLLECTOR_REGION:-remote}
      SHORTVIDEO_ACCOUNT_COLLECT_MASTER_URL: ${SHORTVIDEO_ACCOUNT_COLLECT_MASTER_URL:?set master url, e.g. https://ops.example.com}
      SHORTVIDEO_ACCOUNT_COLLECT_REMOTE_WORKER_TOKEN: ${SHORTVIDEO_ACCOUNT_COLLECT_REMOTE_WORKER_TOKEN:?set collector token}
      SHORTVIDEO_ACCOUNT_COLLECT_WORKER_LEASE_SECONDS: ${SHORTVIDEO_ACCOUNT_COLLECT_WORKER_LEASE_SECONDS:-900}
      SHORTVIDEO_ACCOUNT_COLLECT_WORKER_POLL_MS: ${SHORTVIDEO_ACCOUNT_COLLECT_WORKER_POLL_MS:-15000}
      SHORTVIDEO_ACCOUNT_COLLECT_WORKER_INITIAL_DELAY_MS: ${SHORTVIDEO_ACCOUNT_COLLECT_WORKER_INITIAL_DELAY_MS:-10000}
      SHORTVIDEO_ACCOUNT_COLLECT_WORKER_HEARTBEAT_MS: ${SHORTVIDEO_ACCOUNT_COLLECT_WORKER_HEARTBEAT_MS:-60000}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-/collector/cookies/douyin.txt}
      ACCOUNT_COLLECT_BROWSER_EXECUTABLE_PATH: ${ACCOUNT_COLLECT_BROWSER_EXECUTABLE_PATH:-}
      ACCOUNT_COLLECT_PLAYWRIGHT_TIMEOUT_MS: ${ACCOUNT_COLLECT_PLAYWRIGHT_TIMEOUT_MS:-60000}
      ACCOUNT_COLLECT_MAX_SCROLL_ROUNDS: ${ACCOUNT_COLLECT_MAX_SCROLL_ROUNDS:-80}
      ACCOUNT_COLLECT_SCROLL_MIN_ROUNDS: ${ACCOUNT_COLLECT_SCROLL_MIN_ROUNDS:-10}
      ACCOUNT_COLLECT_SCROLL_IDLE_STREAK_LIMIT: ${ACCOUNT_COLLECT_SCROLL_IDLE_STREAK_LIMIT:-6}
      ACCOUNT_COLLECT_SCROLL_PAUSE_MS: ${ACCOUNT_COLLECT_SCROLL_PAUSE_MS:-2600}
      ACCOUNT_COLLECT_USER_PAGE_SETTLE_MS: ${ACCOUNT_COLLECT_USER_PAGE_SETTLE_MS:-5000}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    volumes:
      - ./collector-cookies:/collector/cookies:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'java .*collector.jar' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
