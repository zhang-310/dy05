spring.application.name=douyin-operations-test

# Database Configuration - Use embedded H2 for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Redis Configuration - Use embedded Redis or mock
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms
spring.redis.database=0

# Logging Configuration
logging.level.root=WARN
logging.level.cn.gaifan.douyinOperations=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Server Configuration
server.port=8080
server.servlet.context-path=/
management.endpoints.web.exposure.include=health,info

# Cache Configuration
spring.cache.type=simple
app.milvus.enabled=false
MILVUS_ENABLED=false

# Security Configuration
app.jwt.secret=test-secret-key-for-testing-only
app.jwt.expiration=3600000
APP_TOKEN_SECRET=test-token-secret-for-testing-only
APP_TOKEN_EXPIRE_HOURS=24
