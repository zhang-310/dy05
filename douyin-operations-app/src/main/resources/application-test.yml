# Test profile for E2E testing
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:douyin_operations}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgresql}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

# Disable unnecessary features for testing
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    defaults:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    cn.gaifan.douyinOperations: INFO
