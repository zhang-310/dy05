spring:
  application:
    name: douyin-operations
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    # 本机开发用 dev；Docker 部署时由 compose 注入 SPRING_PROFILES_ACTIVE=prod
    active: dev
  main:
    allow-circular-references: true
  # OpenAI 兼容调用在 ModelChatStreamServiceImpl 内按需 new OpenAiChatModel，无需全局 Bean；
  # 未设置 spring.ai.openai.api-key 时若不排除，OpenAiAutoConfiguration 会启动失败。
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    # 默认与 dev 一致，避免未激活 profile 时启动报错；可被 application-{profile}.yml 覆盖
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:douyin_operations}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgresql}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    open-in-view: false  # 显式关闭，避免视图渲染期间执行查询；API 项目无 JSP 视图
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          fetch_size: 500
          batch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 1800000  # 30 分钟，AI 分镜/脚本生成等长请求
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  # HTTPS 配置（可选，生产环境推荐启用）
  ssl:
    enabled: false
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tomcat
  http2:
    enabled: true
  shutdown: graceful

# Actuator 和 Prometheus 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.response.time: true
        data.operation.duration: true
    tags:
      application: douyin-operations
      environment: ${SPRING_PROFILES_ACTIVE:dev}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  token:
    secret: ${APP_TOKEN_SECRET}
    expire-hours: ${APP_TOKEN_EXPIRE_HOURS:24}
  milvus:
    enabled: ${MILVUS_ENABLED:true}
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    startup:
      max-attempts: ${MILVUS_STARTUP_MAX_ATTEMPTS:30}
      retry-interval-ms: ${MILVUS_STARTUP_RETRY_MS:2000}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  # AI 第三方 API Key、URL、embedding 模型等均从「配置管理」读取，此处仅为兜底默认
  ai:
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    embedding:
      model: ${AI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
      dimension: ${AI_EMBEDDING_DIM:1024}
      batch-size: ${AI_EMBEDDING_BATCH_SIZE:16}
      parallelism: ${AI_EMBEDDING_PARALLELISM:4}
    reranker:
      enabled: ${AI_RERANKER_ENABLED:false}
      provider: ${AI_RERANKER_PROVIDER:ollama}
      model: ${AI_RERANKER_MODEL:qwen3-embedding:4b}
      cohere:
        model: ${AI_RERANKER_COHERE_MODEL:rerank-v3.5}
      custom:
        url: ${AI_RERANKER_CUSTOM_URL:}
    query-rewrite:
      enabled: ${AI_QUERY_REWRITE_ENABLED:true}
      sub-queries: ${AI_QUERY_REWRITE_SUB_QUERIES:3}
      # HTTP POST /ai/knowledge-base/{id}/search 默认 queryRewrite=false（跳过 LLM 改写）；直播等仍走 Java hybridSearch(..., skipQueryRewrite=false)
    kb:
      cache-enabled: ${AI_KB_CACHE:true}
      init-enabled: ${AI_KB_INIT:true}
      # 共享知识库 owner。默认 0 表示系统公共知识库，供 AI 模块全局复用。
      shared-owner-id: ${AI_KB_SHARED_OWNER_ID:0}
      # 短视频 LF 深度拆解完成后入 ai_index_queue 时写入的知识库：使用 shared-owner-id 对应账号下的库（不属于操作者个人）
      viral-deep-index-kb-name: ${AI_KB_VIRAL_DEEP_INDEX_KB_NAME:}
      allow-shared-fallback: ${AI_KB_ALLOW_SHARED_FALLBACK:true}
      import-parallelism: ${AI_KB_IMPORT_PARALLELISM:6}
      import:
        max-depth: ${AI_KB_IMPORT_MAX_DEPTH:20}
        max-files: ${AI_KB_IMPORT_MAX_FILES:5000}
      # 话术文档类型检测关键词（逗号分隔，空则用默认；用于 DocumentTypeDetector）
      detect:
        script-keywords: ${AI_KB_DETECT_SCRIPT_KEYWORDS:}
      # 混合检索结果语义去重：余弦相似度≥阈值视为重复保留前者（0=关闭，建议 0.90）
      hybrid-dedup-threshold: ${AI_KB_HYBRID_DEDUP_THRESHOLD:0}
      # 去重（Phase 2）
      dedup:
        enabled: ${AI_KB_DEDUP_ENABLED:true}
        doc-fingerprint: ${AI_KB_DEDUP_DOC_FINGERPRINT:true}
        doc-simhash: ${AI_KB_DEDUP_DOC_SIMHASH:true}
        simhash-min-length: ${AI_KB_DEDUP_SIMHASH_MIN_LENGTH:200}
        simhash-distance: ${AI_KB_DEDUP_SIMHASH_DISTANCE:3}
        skip-threshold: ${AI_KB_DEDUP_SKIP_THRESHOLD:0.92}
        downweight-threshold: ${AI_KB_DEDUP_DOWNWEIGHT_THRESHOLD:0.80}
        downweight-factor: ${AI_KB_DEDUP_DOWNWEIGHT_FACTOR:0.6}
      # RAG 话术参考（Phase 3）
      rag:
        enabled: ${AI_KB_RAG_ENABLED:true}
        top-k: ${AI_KB_RAG_TOP_K:8}
        min-score: ${AI_KB_RAG_MIN_SCORE:0.5}
        max-context-chars: ${AI_KB_RAG_MAX_CONTEXT_CHARS:2000}
        token-budget-ratio: ${AI_KB_RAG_TOKEN_BUDGET_RATIO:0.25}
        parallel-timeout-sec: ${AI_KB_RAG_PARALLEL_TIMEOUT_SEC:5}
        # 阶段 B：混合检索 P95 目标（毫秒，仅作告警/文档基准；实际指标见 Micrometer ai.search.duration 与 SearchMetricsCollector）
        slo-hybrid-search-p95-ms-target: ${AI_KB_HYBRID_SEARCH_P95_MS_TARGET:3000}
      # 内容安全扫描（不阻断，仅记入报告/日志）
      security:
        scan-on-upload: ${AI_KB_SECURITY_SCAN_ON_UPLOAD:true}
        scan-on-import: ${AI_KB_SECURITY_SCAN_ON_IMPORT:true}
      # 文档本地归档（可选）：导入时另存一份到本地，便于备份/审计
      doc-archive-enabled: ${AI_KB_DOC_ARCHIVE_ENABLED:false}
      doc-archive-dir: ${AI_KB_DOC_ARCHIVE_DIR:D:/docs}
    # AI 调用额度：每日每用户上限，新用户/新日期自动使用此值（阶段 D：成本与配额入口，业务实现见 payment/配额相关接口）
    quota:
      daily-max: ${AI_QUOTA_DAILY_MAX:5000}
    # 阶段 C：进化适应度记录与自动合并门闸（默认不自动合并生产知识库）
    evolution-fitness:
      record-enabled: ${AI_EVOLUTION_FITNESS_RECORD_ENABLED:true}
      auto-merge-enabled: ${AI_EVOLUTION_AUTO_MERGE_ENABLED:true}
      # 自动合并前是否校验 ES（必选路径）与 Milvus（仅当 app.milvus.enabled=true）
      infra-check-enabled: ${AI_EVOLUTION_INFRA_CHECK_ENABLED:true}
      # 为 true 时从进化主题 category 前缀 ab:{experimentId} 解析并写入 ai_evolve_task.ab_experiment_id / 适应度 experiment_id
      auto-experiment-from-context: ${AI_EVOLUTION_AUTO_EXPERIMENT_FROM_CONTEXT:true}
    evolve:
      enabled: ${EVOLVE_ENABLED:true}
      # 为 false 时忽略 Redis ai:evolve:throttle / 48h 窗口，调度器每轮都尝试（仅建议 dev 关闭；生产保持 true）
      roi-throttle-enabled: ${EVOLVE_ROI_THROTTLE_ENABLED:true}
      cron: ${EVOLVE_CRON:0 0 * * * ?}
      kb-id: ${EVOLVE_KB_ID:}
      kb-ids: ${EVOLVE_KB_IDS:}
      user-id: ${EVOLVE_USER_ID:1}
    # 进化引擎 HTTP 回调：与请求头 X-Viral-Callback-Secret 一致时可无登录调用 /ai/evolution/viral/complete
    evolution:
      viral-callback-secret: ${APP_AI_EVOLUTION_VIRAL_CALLBACK_SECRET:}
    # 深度进化：待深化问题专项研究
    deep-evolve:
      enabled: ${DEEP_EVOLVE_ENABLED:true}
      cron: ${DEEP_EVOLVE_CRON:0 30 6 * * WED,SUN}
      max-per-run: ${DEEP_EVOLVE_MAX_PER_RUN:12}
    es:
      use-ik: ${ES_USE_IK:false}
    openai-url: ${OPENAI_URL:https://api.openai.com}
    deepseek-url: ${DEEPSEEK_URL:https://api.deepseek.com}
    timeout: ${AI_TIMEOUT:90000}
    kling:
      api-url: ${KLING_API_URL:}
      api-key: ${KLING_API_KEY:}
      api-secret: ${KLING_API_SECRET:}
      video-api-url: ${KLING_VIDEO_API_URL:}
      api-version: ${KLING_API_VERSION:v1}  # v1=Kling 2.x, v3=Kling 3.0
    # MiniMax Hailuo 图生视频（国内直连，动作/舞蹈场景优选）
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      api-url: ${MINIMAX_API_URL:}
    # Runway Gen-4 Turbo（海外中转，VFX/特效场景优选）
    runway:
      api-key: ${RUNWAY_API_KEY:}
      api-url: ${RUNWAY_API_URL:}
    # Luma Ray2/Ray3（海外中转，首尾帧控制，电影感强）
    luma:
      api-key: ${LUMA_API_KEY:}
      api-url: ${LUMA_API_URL:}
    # Seedance 2.0 (字节，音视频联合，12参考图)
    seedance:
      api-key: ${SEEDANCE_API_KEY:}
      api-url: ${SEEDANCE_API_URL:}
    # Veo 3.1/3.2 (Google，照片级真实，海外中转)
    veo:
      api-key: ${VEO_API_KEY:}
      api-url: ${VEO_API_URL:}
      model: ${VEO_MODEL:veo-3.1}
    # Wan 2.6 (阿里，低成本批量)
    wan:
      api-key: ${WAN_API_KEY:}
      api-url: ${WAN_API_URL:}
    # Pika 2.2 (fal.ai 中转，动漫/卡通)
    pika:
      api-key: ${FAL_KEY:}
      api-url: ${PIKA_API_URL:}
    # ElevenLabs (音效 SFX + 声音克隆)
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
    # HeyGen (数字人口播)
    heygen:
      api-key: ${HEYGEN_API_KEY:}
      api-url: ${HEYGEN_API_URL:}
    # Suno (BGM 生成，sunoapi.org 等第三方 API)
    suno:
      api-key: ${SUNO_API_KEY:}
      api-url: ${SUNO_API_URL:https://api.sunoapi.org}
      callback-url: ${SUNO_CALLBACK_URL:https://httpbin.org/post}
    # Udio (BGM 生成)
    udio:
      api-key: ${UDIO_API_KEY:}
      api-url: ${UDIO_API_URL:https://api.udioapi.pro}
    stable-diffusion-url: ${STABLE_DIFFUSION_URL:http://localhost:7860}
    grafana-url: ${GRAFANA_URL:}
    tts-url: ${TTS_URL:http://localhost:5000}
    # 讯飞 TTS：配置后优先使用讯飞，否则使用 tts-url 代理
    tts:
      iflytek:
        app-id: ${IFLYTEK_APP_ID:}
        api-key: ${IFLYTEK_API_KEY:}
        api-secret: ${IFLYTEK_API_SECRET:}
  # 本机视频解析：爆款深度分析需下载视频→ASR→抽帧；依赖 yt-dlp、ffmpeg；ASR 可选 whisper CLI
  # 无工具时管线会降级为推演，但 Bean 必须启用才会跑下载/抽帧。Docker/无 CLI 环境请设 VIDEO_ANALYSIS_ENABLED=false
  video-analysis:
    enabled: ${VIDEO_ANALYSIS_ENABLED:true}
    work-dir: ${VIDEO_ANALYSIS_WORK_DIR:/tmp/video-analysis}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    post-processing:
      enabled: ${VIDEO_POST_PROCESSING_ENABLED:true}
      default-lut: ${VIDEO_POST_PROCESSING_LUT:}
    video-cache:
      enabled: ${VIDEO_CACHE_ENABLED:true}  # Phase 4.2: Redis 缓存，相同输入秒返回
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    # Netscape 格式 cookies.txt（从浏览器导出）；抖音下载失败时优先配置此项
    yt-dlp-cookies-file: ${YT_DLP_COOKIES_FILE:}
    # 无 cookies 文件时可用，如 chrome / edge:Default（需本机浏览器；与爆款元数据提取器逻辑一致）
    yt-dlp-cookies-from-browser: ${YT_DLP_COOKIES_FROM_BROWSER:}
    # 部分网络环境下抖音直连；与 ViralMetadataExtractor 一致
    yt-dlp-force-direct-for-douyin: ${YT_DLP_FORCE_DIRECT_FOR_DOUYIN:false}
    yt-dlp-user-agent: ${YT_DLP_USER_AGENT:}
    yt-dlp-impersonate-douyin: ${YT_DLP_IMPERSONATE_DOUYIN:}
    whisper-enabled: ${WHISPER_ENABLED:true}
    whisper-model: ${WHISPER_MODEL:base}
    # 抖音分享页常触发 yt-dlp cookie 问题；仅当明确需要跳过本机下载时设为 true
    douyin-skip-yt-dlp-download: ${DOUYIN_SKIP_YT_DLP_DOWNLOAD:false}
    # 抖音：yt-dlp 失败时是否尝试 Playwright 拦截 CDN（需 playwright-enabled=true，并执行 playwright install chromium）
    douyin-yt-dlp-fallback-playwright: ${DOUYIN_YT_DLP_FALLBACK_PLAYWRIGHT:true}
    playwright-enabled: ${PLAYWRIGHT_ENABLED:true}
    playwright-timeout-ms: ${PLAYWRIGHT_TIMEOUT_MS:30000}

douyin:
  api:
    client-key: ${DOUYIN_CLIENT_KEY:your_client_key}
    client-secret: ${DOUYIN_CLIENT_SECRET:your_client_secret}
    base-url: ${DOUYIN_API_BASE_URL:https://open.douyin.com}
    callback-url: ${DOUYIN_CALLBACK_URL:http://localhost:8080/api/v1/douyin/oauth/callback}
    collector:
      enabled: ${DOUYIN_COLLECTOR_ENABLED:false}

# TianAPI（天聚数行）https://www.tianapi.com — 控制台申请 Key 与接口权限；密钥勿入库
tianapi:
  enabled: ${TIANAPI_ENABLED:true}
  api-key: ${TIANAPI_API_KEY:b617a43d965f558c7d0923dc663853b0}
  base-url: ${TIANAPI_BASE_URL:https://apis.tianapi.com}
  hot-cache-minutes: ${TIANAPI_HOT_CACHE_MINUTES:5}
  material-import-enabled: ${TIANAPI_MATERIAL_IMPORT_ENABLED:true}
  material-import-cron: ${TIANAPI_MATERIAL_IMPORT_CRON:0 0 2 * * ?}

# 商品模块：销售写入后是否自动扣减库存（默认 false）
product:
  sales:
    auto-deduct-inventory: ${PRODUCT_SALES_AUTO_DEDUCT_INVENTORY:false}

# API 前缀与项目约定一致
api:
  prefix: /api/v1

# 第三方登录 OAuth（微信/QQ/抖音/火山）：各平台需在开放平台申请 appId/appSecret 并配置回调
auth:
  oauth:
    # 后端 callback 完整 URL，用于拼接到各平台 redirect_uri（如 http://localhost:8080/api/v1/auth/oauth/callback）
    callback-base-url: http://localhost:8080
    providers:
      wechat:
        enabled: false
        app-id: ""
        app-secret: ""
        authorize-url: "https://open.weixin.qq.com/connect/qrconnect"
        token-url: "https://api.weixin.qq.com/sns/oauth2/access_token"
        user-info-url: "https://api.weixin.qq.com/sns/userinfo"
        scope: "snsapi_login"
      qq:
        enabled: false
        app-id: ""
        app-secret: ""
        authorize-url: "https://graph.qq.com/oauth2.0/authorize"
        token-url: "https://graph.qq.com/oauth2.0/token"
        user-info-url: "https://graph.qq.com/oauth2.0/me"
        scope: "get_user_info"
      douyin:
        enabled: false
        app-id: ""
        app-secret: ""
        authorize-url: "https://open.douyin.com/platform/oauth/connect/"
        token-url: "https://open.douyin.com/oauth/access_token/"
        user-info-url: "https://open.douyin.com/oauth/userinfo/"
        scope: "user_info"
      volcano:
        enabled: false
        app-id: ""
        app-secret: ""
        authorize-url: "https://open.volcengineapi.com/oauth/authorize"
        token-url: "https://open.volcengineapi.com/oauth/token"
        user-info-url: "https://open.volcengineapi.com/oauth/userinfo"
        scope: "user_info"

# Resilience4j 配置
resilience4j:
  retry:
    instances:
      liveAiRetry:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - java.net.SocketTimeoutException
      wecomPush:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
  timelimiter:
    instances:
      liveAiTimeout:
        timeoutDuration: 30s
  ratelimiter:
    instances:
      api-limiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 100
        timeoutDuration: 5s
      login-limiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 5
        timeoutDuration: 5s
      # P1-3: 企业微信推送速率限制（每分钟10次）
      wecomPush:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 0s
      # P1-1: AI 对话速率限制（每分钟20次）
      aiChat:
        limitRefreshPeriod: 1m
        limitForPeriod: 20
        timeoutDuration: 0s
      # P1-1: 工作流执行速率限制（每分钟5次）
      workflowExec:
        limitRefreshPeriod: 1m
        limitForPeriod: 5
        timeoutDuration: 0s
      # P1-2: AI 生成接口限流（每分钟10次）
      aiGenerate:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 5s
      # P1-1: 搜索 API 限流（每分钟30次）
      searchApi:
        limitRefreshPeriod: 1m
        limitForPeriod: 30
        timeoutDuration: 5s
      # P1-1: 归因分析触发限流（每分钟10次）
      attributionTrigger:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 0s
      # P1-1: Dashboard 统计限流（每分钟10次）
      dashboard:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 0s
  circuitbreaker:
    instances:
      api-circuit-breaker:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
      milvus:
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        slidingWindowSize: 10
        recordExceptions:
          - java.lang.Exception
      elasticsearch:
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        slidingWindowSize: 10
        recordExceptions:
          - java.lang.Exception
